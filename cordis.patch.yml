# dsh-lazy-tools: cache-friendly progressive tool disclosure.
# The row config below is the shipped default; a profile-level patch may override it.
- insert:
    - id: lazy-tools
      name: dsh-lazy-tools
      config:
        promptSection: true
        searchLimit: 8
        statusTool: true
        resumePreserve: true
        # The resident layer re-calibrates from this machine's own tool calls.
        # The interval counts from the end of the last census, not from install;
        # set intervalDays: 0 to keep it manual (toolbox_census).
        census:
          enabled: true
          intervalDays: 30
          windowDays: 30
          minCallsPerDay: 3
          maxSchemaChars: 1500
          dominantCallsPerDay: 50
          maxSessions: 200
          apply: true
          startDelayMs: 30000
